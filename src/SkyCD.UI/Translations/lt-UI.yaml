ui.AboutSkyCd: "Apie SkyCD"
ui.AboutStoryWhat: "SkyCD indeksuoja jūsų kompaktinių diskų turinį ir parodo, kokius diskus turi kiti žmonės. Katalogas saugomas paprastu tekstu, todėl bet kas gali jį skaityti, redaguoti ir juo dalintis."
ui.AboutStoryOrigin: "Pirmąsias v1 ir v2 versijas VB.NET kalba SkyFTP svetainei sukūrė Raimondas Rimkevičius (dar žinomas kaip MekDrop) ir išleido kaip nemokamą programą – naudokitės ja tiek, kiek reikia ;)"
ui.AboutStoryRewrite: "Tai v3 perrašymas, sukurtas su Avalonia ir .NET 10. Tai ta pati programa, tęsianti savo istoriją, o ne ją pakeičianti."
