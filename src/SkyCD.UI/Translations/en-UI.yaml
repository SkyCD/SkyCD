ui.AboutSkyCd: "About SkyCD"
ui.AboutStoryWhat: "SkyCD indexes the contents of your CDs and shows you which discs other people have. The catalog is saved as plain text, so anyone can read, edit and share it."
ui.AboutStoryOrigin: "The original v1 and v2 versions were VB.NET programs made for the SkyFTP web site by Raimondas Rimkevičius (aka MekDrop) and released as freeware — use it for as long as you need ;)"
ui.AboutStoryRewrite: "This is the v3 rewrite built on Avalonia and .NET 10. It is the same program carried forward, not a replacement of its history."
