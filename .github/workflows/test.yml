name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NuGetPackageSourceCredentials_skycd: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  style:
    name: Style (.NET format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check assembly naming
        shell: pwsh
        run: ./tools/scripts/ci/check-naming.ps1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore solution
        run: dotnet restore SkyCD.slnx

      - name: Verify formatting
        run: dotnet format SkyCD.slnx --verify-no-changes --verbosity minimal

  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: style
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore solution
        run: dotnet restore SkyCD.slnx

      - name: Build solution
        run: dotnet build SkyCD.slnx --configuration Release --no-restore -warnaserror

      - name: Test solution
        shell: bash
        run: |
          # A crashed test host aborts its whole assembly run, so one crashing assembly can fail the jobs of
          # unrelated changes. Rerun only for that signature; assertion and build failures fail immediately.
          test_command=(dotnet test SkyCD.slnx --configuration Release --no-build --verbosity normal
            --test-adapter-path "${{ github.workspace }}/tools/SkyCD.TestLogger/bin/Release/net10.0"
            --logger "console;verbosity=quiet"
            --logger "ansi"
            --logger "trx;LogFilePrefix=test-results-${{ matrix.os }}"
            --results-directory "artifacts/test-results/${{ matrix.os }}")

          mkdir -p artifacts/test-logs

          for attempt in 1 2 3; do
            log="artifacts/test-logs/dotnet-test-attempt-${attempt}.log"
            status=0
            "${test_command[@]}" 2>&1 | tee "$log" || status=$?

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q "Test host process crashed" "$log"; then
              exit "$status"
            fi

            echo "::warning::Test host process crashed on attempt ${attempt}; rerunning the solution tests."
          done

          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/${{ matrix.os }}/

  license-compliance:
    name: License Compliance
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      # Trivy reads package licenses from the nuspec files in the NuGet global
      # packages folder, so restore must run before the scan.
      - name: Restore solution
        run: dotnet restore SkyCD.slnx --locked-mode

      - name: Scan dependency licenses
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: '1'

  sbom:
    name: CycloneDX SBOM
    if: github.event_name == 'push'
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install CycloneDX tool
        shell: pwsh
        run: |
          dotnet tool update --global CycloneDX --version 6.1.1
          "$env:HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          dotnet-CycloneDX SkyCD.slnx --output artifacts/licenses --filename bom.json --output-format Json --exclude-test-projects

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: license-artifacts
          path: artifacts/licenses/
