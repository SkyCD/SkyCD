name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NuGetPackageSourceCredentials_skycd: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  style:
    name: Style (.NET format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check assembly naming
        shell: pwsh
        run: ./tools/scripts/ci/check-naming.ps1

      - name: Check plugin icons
        shell: pwsh
        run: ./tools/scripts/ci/check-plugin-icons.ps1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore solution
        run: dotnet restore SkyCD.slnx

      - name: Verify formatting
        run: dotnet format SkyCD.slnx --verify-no-changes --verbosity minimal

  build:
    name: Build (${{ matrix.os }})
    needs: style
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore solution
        run: dotnet restore SkyCD.slnx

      - name: Build solution
        run: dotnet build SkyCD.slnx --configuration Release --no-restore -warnaserror

  test-shards:
    name: Plan test shards
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Plan shards
        id: plan
        shell: bash
        run: |
          mapfile -t projects < <(find tests -mindepth 2 -maxdepth 2 -name '*.Tests.csproj' | sort)

          matrix=$(printf '%s\n' "${projects[@]}" | jq -R -s -c --argjson shards 8 '
            split("\n") | map(select(length > 0))
            | . as $all
            | [range(0; $shards) as $shard
                | [$all | to_entries[] | select(.key % $shards == $shard) | .value] as $assigned
                | {
                    id: $shard,
                    paths: ($assigned | join(" ")),
                    label: ($assigned | map(split("/")[-1] | sub("\\.csproj$"; "")) | join(", "))
                  }]
          ')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Test shards"
            echo ""
            echo "| Shard | Projects |"
            echo "| :--- | :--- |"
            jq -r '.[] | "| \(.id) | \(.label) |"' <<< "$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard.id }})
    needs: [style, test-shards]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: ${{ fromJSON(needs.test-shards.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Build test logger
        run: dotnet build tools/SkyCD.TestLogger/SkyCD.TestLogger.csproj --configuration Release

      - name: Test ${{ matrix.shard.label }}
        shell: bash
        timeout-minutes: 15
        env:
          SHARD_PATHS: ${{ matrix.shard.paths }}
        run: |
          # The shard assignment is computed by the Plan test shards job, so every OS runs the same
          # projects and the step name lists exactly what this job covers.
          read -r -a projects <<< "$SHARD_PATHS"

          results="artifacts/test-results/${{ matrix.os }}/shard-${{ matrix.shard.id }}"
          mkdir -p artifacts/test-logs "$results"

          status=0
          for project in "${projects[@]}"; do
            name=$(basename "$project" .csproj)
            log="artifacts/test-logs/${name}.log"
            echo "::group::${name}"
            project_status=0
            dotnet test "$project" --configuration Release \
              --test-adapter-path "${{ github.workspace }}/tools/SkyCD.TestLogger/bin/Release/net10.0" \
              --logger "console;verbosity=quiet" \
              --logger "ansi" \
              --logger "trx;LogFilePrefix=${name}" \
              --results-directory "$results/${name}" \
              --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none \
              > "$log" 2>&1 || project_status=$?

            if [ "$project_status" -ne 0 ]; then
              echo "::error::${name} failed with exit code ${project_status}."
              cat "$log"
              status=$project_status
            else
              echo "Passed ${name}."
            fi
            echo "::endgroup::"
          done

          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-shard-${{ matrix.shard.id }}
          path: |
            artifacts/test-results/${{ matrix.os }}/shard-${{ matrix.shard.id }}/
            artifacts/test-logs/

  license-compliance:
    name: License Compliance
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      # Trivy reads package licenses from the nuspec files in the NuGet global
      # packages folder, so restore must run before the scan.
      - name: Restore solution
        run: dotnet restore SkyCD.slnx --locked-mode

      - name: Scan dependency licenses
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: '1'

  sbom:
    name: CycloneDX SBOM
    if: github.event_name == 'push'
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install CycloneDX tool
        shell: pwsh
        run: |
          dotnet tool update --global CycloneDX --version 6.1.1
          "$env:HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          dotnet-CycloneDX SkyCD.slnx --output artifacts/licenses --filename bom.json --output-format Json --exclude-test-projects

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: license-artifacts
          path: artifacts/licenses/
